services:
  - type: web
    name: spotify-ai-support-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.ui_server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: AGENT_MODE
        value: mock
      - key: AGENT_MODEL
        value: gemini/gemini-1.5-flash
      - key: EMBEDDING_PROVIDER
        value: local
      - key: RAG_TOP_K
        value: "5"
      - key: AUTO_HANDLE_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: MAX_REPLY_CHARS
        value: "280"
